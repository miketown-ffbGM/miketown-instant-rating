<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MIKETOWN Instant Rating</title><style>body{margin:0;background:#f5f7fb;color:#182436;font:15px system-ui,Arial}header{background:#123a78;color:white;padding:26px max(18px,calc((100% - 1100px)/2))}h1{margin:0;font-size:29px}header p{opacity:.85}main{max-width:1100px;margin:auto;padding:22px 16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.panel{background:white;border:1px solid #dde4ef;border-radius:12px;padding:17px}.stat strong{display:block;font-size:26px;color:#123a78}.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin:20px 0}input,select,button{font:inherit;border:1px solid #bac6d8;border-radius:8px;padding:10px;max-width:100%;box-sizing:border-box}button{cursor:pointer;background:#123a78;color:white;border:0}button.secondary{background:#e7edf7;color:#123a78}table{border-collapse:collapse;width:100%;background:white}th,td{text-align:left;padding:11px;border-bottom:1px solid #e6eaf0}th{background:#e9eef6;color:#243e61}.scroll{overflow:auto;border-radius:10px;border:1px solid #dde4ef}a{color:#1555a4}dialog{border:0;border-radius:12px;max-width:460px;width:calc(100% - 35px);box-shadow:0 12px 55px #0004}dialog label{display:block;margin:10px 0 4px}dialog input,dialog select{width:100%}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}.note{font-size:13px;color:#53657b}nav a{color:white;margin-right:18px}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}th,td{padding:8px;font-size:13px}header{padding:20px 16px}}</style></head><body><header><h1>🍪 MIKETOWN Instant Rating</h1><p>Oreo reviews, rankings & what's next.</p><nav><a href="https://www.youtube.com/playlist?list=PL7Fnb8XgidP3IO4kWO6XBmzaFAp0888ll" target="_blank" rel="noopener">YouTube</a><a href="https://www.tiktok.com/@themiketown" target="_blank" rel="noopener">TikTok</a><a href="https://www.instagram.com/miketown/" target="_blank" rel="noopener">Instagram</a></nav></header><main><div class="stats" id="stats"></div><div class="toolbar"><input id="search" placeholder="Search flavors" aria-label="Search flavors"><select id="filter"><option value="">All statuses</option><option>Reviewed</option><option>On Hand</option><option>Incoming</option><option>Wish List</option><option>Old Post</option></select><select id="sort"><option value="number">Review order</option><option value="name">Flavor A–Z</option><option value="rating">Highest rated</option><option value="date">Newest reviewed</option></select><button id="add">+ Add Oreo</button><button id="export" class="secondary">Export CSV</button></div><p class="note">Ratings and dates are blank until entered. Changes are saved in this browser only; Google Sheets sync is not enabled yet.</p><div class="scroll"><table><thead><tr><th>Review #</th><th>Flavor</th><th>Status</th><th>Rating / 5</th><th>Date Reviewed</th><th>Videos</th><th></th></tr></thead><tbody id="body"></tbody></table></div></main><dialog id="dialog"><form id="form"><h2 id="formtitle">Edit Oreo</h2><input id="id" type="hidden"><label for="flavor">Flavor</label><input id="flavor" required maxlength="120"><label for="status">Status</label><select id="status"><option>Wish List</option><option>Incoming</option><option>On Hand</option><option>Reviewed</option><option>Old Post</option></select><label for="number">Review number (e.g. 4.48)</label><input id="number" pattern="4\\.[0-9]+"><label for="rating">Rating (1–5, decimals allowed)</label><input id="rating" type="number" min="1" max="5" step="any"><label for="date">Date Reviewed</label><input id="date" type="date"><label for="youtube">YouTube video URL</label><input id="youtube" type="url"><label for="tiktok">TikTok video URL</label><input id="tiktok" type="url"><label for="instagram">Instagram video URL</label><input id="instagram" type="url"><label for="notes">Notes</label><input id="notes"><div class="actions"><button type="button" class="secondary" id="cancel">Cancel</button><button type="submit">Save Oreo</button></div></form></dialog><script>const seed="Apple Cider Donut|Wish List\nDirtcake|Wish List\nSnickerdoodle|Wish List\nSpace Dunk|Wish List\nCotton Candy|Wish List\nStar Wars|Incoming\nNONE|Incoming\nSugar Free Rose (Taiwan)|On Hand\nBlack & White|On Hand\nPeach Oolong Tea|On Hand\nStrawberry Creme|On Hand\nCoke|On Hand\nLoaded Oreo|On Hand\nThe Most Oreo|On Hand\nPost Malone|Reviewed\nChocolate Covered Pretzel|Reviewed\nSM'Oreo|Reviewed\nSelena Gomez|Reviewed\nCinnamon Bun (Korea)|Reviewed\nStrawberry Creme (Korea)|Reviewed\nBlueberry Pie|Reviewed\nGolden Birthday Cake|Reviewed\nBirthday Cake (Taiwan)|Reviewed\nGreen Matcha Ice Cream (Taiwan)|Reviewed\nKey Lime Pie Chocolate (Mexican)|Reviewed\nApple Pie à la Mode|Reviewed\nHazelnut (Taiwan)|Reviewed\nStrawberry Frosted Donut|Reviewed\nMatcha Fig|Reviewed\nReese's PB|Reviewed\nBlueberry Raspberry|Reviewed\nMaple Creme|Reviewed\nPeach Oolong Tea|Reviewed\nOreo Mint|Reviewed\nSupreme|Reviewed\nPeanut Butter|Reviewed\nPumpkin Spice|Reviewed\nBoo|Reviewed\nHalloween|Reviewed\nPeach Grape|Reviewed\nCinnamon Bun (Korea)|Reviewed\nThanksgiving|Reviewed\nVanilla Latte (UK)|Reviewed\nCookie Dough|Reviewed\nPascall Marshmallow (AUS)|Reviewed\nChurro|Reviewed\nLimon|Reviewed\nStuf of Doom|Reviewed\nPeeps|Reviewed\nDill Pickle|Reviewed\nFirecracker|Reviewed\nSmoreo|Reviewed\nBTS Brown Sugar Pancake|Reviewed\nCinnamon Bun|Reviewed\nBrown Sugar Bubble Tea (Canada|Reviewed\nSalted Caramel|Reviewed\nSour Patch Kid|Reviewed\nSour Patch Kid Lime (Australia)|Reviewed\nDeep Fried|Reviewed\nChicken & Waffles|Reviewed\nBanana Pudding|Reviewed\nCoke|Old Post".split('\n').map((s,i)=>{const [flavor,status]=s.split('|');return{id:i+1,flavor,status,number:status==='Reviewed'?'4.'+String(i-13).padStart(2,'0'):'',rating:'',date:'',youtube:'',tiktok:'',instagram:'',notes:''}});let data;try{data=JSON.parse(localStorage.getItem('miketown-oreo-v1'))||seed}catch{data=seed}const $=id=>document.getElementById(id);const save=()=>localStorage.setItem('miketown-oreo-v1',JSON.stringify(data));const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){let rated=data.filter(x=>x.status==='Reviewed'&&x.rating!==''&&Number.isFinite(+x.rating));let avg=rated.length?(rated.reduce((s,x)=>s+ +x.rating,0)/rated.length).toFixed(2):'—';$('stats').innerHTML=[['Reviewed',data.filter(x=>x.status==='Reviewed').length],['Average rating',avg],['On hand',data.filter(x=>x.status==='On Hand').length],['In queue',data.filter(x=>['Wish List','Incoming','On Hand'].includes(x.status)).length]].map(([k,v])=>'<div class="stat">'+escape(k)+'<strong>'+v+'</strong></div>').join('');let a=data.filter(x=>(!$('filter').value||x.status===$('filter').value)&&x.flavor.toLowerCase().includes($('search').value.toLowerCase()));let sort=$('sort').value;a.sort((x,y)=>sort==='name'?x.flavor.localeCompare(y.flavor):sort==='rating'?(Number(y.rating)||0)-(Number(x.rating)||0):sort==='date'?(y.date||'').localeCompare(x.date||''):((parseInt(y.number.split('.')[1])||0)-(parseInt(x.number.split('.')[1])||0)));$('body').innerHTML=a.map(x=>'<tr><td>'+escape(x.number||'—')+'</td><td><strong>'+escape(x.flavor)+'</strong></td><td>'+escape(x.status)+'</td><td>'+escape(x.rating||'—')+'</td><td>'+escape(x.date||'—')+'</td><td>'+['youtube','tiktok','instagram'].filter(k=>x[k]).map(k=>'<a target="_blank" rel="noopener noreferrer" href="'+escape(x[k])+'">'+k[0].toUpperCase()+'</a>').join(' · ')+'</td><td><button type="button" data-edit="'+x.id+'">Edit</button></td></tr>').join('')||'<tr><td colspan="7">No matching Oreos</td></tr>'}function edit(id){let x=data.find(x=>x.id===id)||{id:'',flavor:'',status:'Wish List',number:'',rating:'',date:'',youtube:'',tiktok:'',instagram:'',notes:''};for(let k of ['id','flavor','status','number','rating','date','youtube','tiktok','instagram','notes'])$(k).value=x[k]??'';$('formtitle').textContent=id?'Edit Oreo':'Add Oreo';$('dialog').showModal()}$('add').onclick=()=>edit(null);$('cancel').onclick=()=>$('dialog').close();$('body').onclick=e=>{let b=e.target.closest('[data-edit]');if(b)edit(+b.dataset.edit)};for(let k of ['search','filter','sort'])$(k).addEventListener(k==='search'?'input':'change',render);$('form').onsubmit=e=>{e.preventDefault();let x={};for(let k of ['id','flavor','status','number','rating','date','youtube','tiktok','instagram','notes'])x[k]=$(k).value.trim();if(x.rating!==''&&(!Number.isFinite(+x.rating)||+x.rating<1||+x.rating>5)){alert('Rating must be between 1 and 5.');return}if(x.status==='Reviewed'&&!x.number){let max=Math.max(47,...data.map(r=>parseInt((r.number||'').split('.')[1])||0));x.number='4.'+String(max+1).padStart(2,'0')}if(x.id){let i=data.findIndex(r=>r.id===+x.id);if(i>=0)data[i]={...x,id:+x.id}}else{data.push({...x,id:Math.max(0,...data.map(r=>r.id))+1})}save();$('dialog').close();render()};$('export').onclick=()=>{let keys=['number','flavor','status','rating','date','youtube','tiktok','instagram','notes'];let csv=[keys.join(','),...data.map(r=>keys.map(k=>'"'+String(r[k]??'').replace(/"/g,'""')+'"').join(','))].join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='miketown-oreo-ratings.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};render();</script></body></html>
