ew Set(guestNames(x).map(g=>g.toLocaleLowerCase()))){const entry=guests.get(name)||{name:guestNames(x).find(g=>g.toLocaleLowerCase()===name),count:0};entry.count++;guests.set(name,entry)}const frequent=[...guests].sort((a,b)=>b[1].count-a[1].count||a[1].name.localeCompare(b[1].name)).slice(0,2);const flavor=x=>escape(x.flavor);const card=(title,items)=>"<section class=\"highlight\"><h2>"+title+"</h2><ol>"+(items||"<li class=\"meta\">No reviews yet</li>")+"</ol></section>";$("highlights").innerHTML=card("Most recent",recent.map(x=>"<li>"+flavor(x)+"<span class=\"meta\">"+escape(x.date||"No date")+" · "+escape(x.rating||"—")+"/5</span></li>").join(""))+card("Highest rated",highest.map(x=>"<li>"+flavor(x)+"<span class=\"meta\">"+escape(x.rating)+"/5</span></li>").join(""))+card("Most frequent guests",frequent.map(([key,g])=>"<li>"+guestTag(key,g.name)+"<span class=\"meta\">"+g.count+" review"+(g.count===1?"":"s")+"</span></li>").join(""))}function flavorCards(items,showCountry=true){return '<div class="flavor-card-grid">'+items.map(x=>'<article class="flavor-card"><div class="flavor-card-label">ON DECK</div><div class="flavor-card-title">'+escape(x.flavor)+'</div>'+(showCountry?'<div class="flavor-card-country">'+flag(x.country)+' '+escape(countryName(x.country))+'</div>':'')+'</article>').join('')+'</div>'}function renderAnalytics(){const rated=data.filter(x=>x.status==='Reviewed'&&x.rating!==''&&Number.isFinite(+x.rating));const nums=rated.map(x=>+x.rating).sort((a,b)=>a-b),n=nums.length;const bars=(rows,details=null)=>rows.map(([label,v,max,count],idx)=>'<div class="insight-row" tabindex="0" aria-label="'+escape(label+': '+v+(count===undefined?'':' ('+count+' reviews)'))+'"><span class="insight-tooltip" role="tooltip">'+(details&&details[idx]?'<span class="tooltip-heading">Flavor, Rating</span>'+details[idx].map(x=>'<span class="tooltip-item">'+escape(x.flavor)+', '+Number(x.rating).toFixed(2)+'</span>').join(''):escape(label+': '+v+(count===undefined?'':' ('+count+ /span>',groups[i],labels[i])+'</div>').join('')+'</div>';let progress=0;const stops=bins.map((count,i)=>{const start=progress/n*100;progress+=count;return colors[i]+' '+start+'% '+progress/n*100+'%'});const donut='<div class="rating-donut-wrap"><div class="rating-donut" style="background:conic-gradient('+stops.join(',')+')"><div class="rating-donut-center"><strong>'+n+'</strong>Reviews</div></div></div><div class="rating-legend">'+bins.map((count,i)=>hover('<span><i class="rating-swatch" style="background:'+colors[i]+'"></i>'+labels[i]+' ('+count+')</span>',groups[i],labels[i])).join('')+'</div>';const dots='<div class="rating-dotplot">'+bins.map((count,i)=>'<div class="rating-dot-col"><div class="rating-dot-stack">'+groups[i].map(x=>hover('<div class="rating-dot" style="background:'+colors[i]+'"></div>',[x],x.flavor+', '+x.rating)).join('')+'</div><span class="rating-column-label">'+labels[i]+'</span></div>').join('')+'</div>';const waffle='<div class="rating-waffle">'+groups.flatMap((g,i)=>g.map(x=>hover('<div class="rating-waffle-cell" style="background:'+colors[i]+'"></div>',[x],x.flavor+', '+x.rating))).join('')+'</div><div class="rating-legend">'+bins.map((count,i)=>'<span><i class="rating-swatch" style="background:'+colors[i]+'"></i>'+labels[i]+' ('+count+')</span>').join('')+'</div>';const countryDots='<div class="country-range">'+country.map(([name,average])=>{const items=[...byCountry.get(name)].sort((a,b)=>+b.rating-(+a.rating)),values=items.map(x=>+x.rating),lo=Math.min(...values),hi=Math.max(...values),avg=Number(average),pct=v=>Math.max(0,Math.min(100,v/5*100));return '<div class="country-range-row"><span class="country-range-name">'+escape(name)+'</span><div class="country-range-track"><div class="country-range-line" style="left:'+pct(lo)+'%;width:'+(pct(hi)-pct(lo))+'%"></div><span class="country-range-point low" style="left:'+pct(lo)+'%"></span><span class="country-range-point avg" style="left:'+pct(avg)+'%"></span><span class="country-range-point h const endpoint='https://script.google.com/macros/s/AKfycbzlCOTLlvWDzmKU0TN9g0PtPFjt9Z3qeuDVYmPCpyUuN_w3K9nYqzZQicgzeImekbDe7Q/exec';
const note=document.querySelector('.note');
function importRows(rows){
 if(!Array.isArray(rows)||rows.length<2||!Array.isArray(rows[0]))throw Error('Unexpected sheet format');
 const headers=rows[0].map(v=>String(v||'').trim().toLowerCase());
 const fi=headers.indexOf('flavor'),si=headers.indexOf('status');
 if(fi<0)throw Error('Missing Flavor column');
 const ix=(...names)=>names.map(n=>headers.indexOf(n)).find(i=>i>=0)??-1;
 const ci=ix('country'),gi=ix('guests','guest'),ri=ix('rating','score'),di=ix('review date','date reviewed','date'),yi=ix('youtube','youtube url'),ti=ix('tiktok','tiktok url'),ii=ix('instagram','instagram url'),ni=ix('notes');
 const get=(row,i)=>i<0?'':String(row[i]??'').trim();
 const normalize=v=>{
  const text=String(v??'').trim();
  if(/^4[.]\d+/.test(text))return 'Reviewed';
  if(/reviewed/i.test(text))return 'Reviewed';
  if(/on\s*hand/i.test(text))return 'On Hand';
  if(/incoming/i.test(text))return 'Incoming';
  if(/wish\s*list/i.test(text))return 'Wish List';
  if(/old\s*posts?/i.test(text))return 'Old Post';
  return '';
 };
 let section='';
 return rows.slice(1).map((r,i)=>{
  if(!Array.isArray(r))return null;
  const first=get(r,0);
  const firstStatus=normalize(first);
  if(firstStatus)section=firstStatus;
  const flavor=get(r,fi);
  if(!flavor||flavor.toUpperCase()==='NONE')return null;
  const explicit=normalize(get(r,si));
  const status=firstStatus||explicit||section;
  const numberFromFirst=first.match(/4[.]\d+/)?.[0]||'';
  return {id:i+1,flavor,status,number:get(r,ix('review number','review #'))||numberFromFirst,rating:get(r,ri),date:get(r,di),guests:get(r,gi),country:get(r,ci),youtube:get(r,yi),tiktok:get(r,ti),instagram:get(r,ii),notes:get(r,ni)};
 }).filter(Boolean);
}
async function loadSheet(){
 try{
  const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),12000);
  let response;try{response=await fetch(endpoint+(endpoint.includes('?')?'&':'?')+'_ts='+Date.now(),{redirect:'follow',signal:controller.signal,cache:'no-store'})}finally{clearTimeout(timer)}
  if(!response.ok)throw Error('HTTP '+response.status);
  const payload=await response.json();
  if(!payload.ok)throw Error('API returned an error');
  data=importRows(payload.data);
  const recognized=['Reviewed','On Hand','Incoming','Wish List','Old Post'];
  const unknown=[...new Set(data.map(x=>x.status).filter(x=>x&&!recognized.includes(x)))];
  const blankStatuses=data.filter(x=>!x.status).length;
  const statusCounts=Object.entries(data.reduce((a,x)=>(a[x.status||'(blank)']=(a[x.status||'(blank)']||0)+1,a),{})).map(([k,v])=>k+': '+v).join(' · ');
  note.textContent='Live Google Sheets · Last refreshed '+new Intl.DateTimeFormat(undefined,{dateStyle:'medium',timeStyle:'short'}).format(new Date())+' · '+data.length+' flavors loaded · Status breakdown: '+statusCounts+(blankStatuses?' · Check Status column in Sheet1.':'')+(unknown.length?' · Unrecognized: '+unknown.slice(0,8).join(', '):'')+'.';
  render();
 }catch(e){
  note.textContent='Could not load Google Sheets. Please refresh to try again. No sample data is displayed.';
  render();
 }
}
loadSheet();document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadSheet()});window.addEventListener('focus',()=>{if(!document.hidden)loadSheet()});</script></body></html>
