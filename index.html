<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MIKETOWN Instant Rating</title><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2229%22%20fill%3D%22%23bd8046%22%20stroke%3D%22%2375401f%22%20stroke-width%3D%223%22%2F%3E%3Ccircle%20cx%3D%2220%22%20cy%3D%2219%22%20r%3D%225%22%20fill%3D%22%2338221b%22%2F%3E%3Ccircle%20cx%3D%2240%22%20cy%3D%2216%22%20r%3D%224%22%20fill%3D%22%2338221b%22%2F%3E%3Ccircle%20cx%3D%2231%22%20cy%3D%2233%22%20r%3D%226%22%20fill%3D%22%2338221b%22%2F%3E%3Ccircle%20cx%3D%2217%22%20cy%3D%2243%22%20r%3D%224%22%20fill%3D%22%2338221b%22%2F%3E%3Ccircle%20cx%3D%2245%22%20cy%3D%2243%22%20r%3D%225%22%20fill%3D%22%2338221b%22%2F%3E%3Ccircle%20cx%3D%2229%22%20cy%3D%2251%22%20r%3D%222.5%22%20fill%3D%22%2338221b%22%2F%3E%3C%2Fsvg%3E"><style>body{margin:0;background:#f5f7fb;color:#182436;font:15px system-ui,Arial}header{background:#123a78;color:white;padding:26px max(18px,calc((100% - 1100px)/2))}h1{margin:0;font-size:29px}header p{opacity:.85}main{max-width:1100px;margin:auto;padding:22px 16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.panel{background:white;border:1px solid #dde4ef;border-radius:12px;padding:17px}.stat strong{display:block;font-size:26px;color:#123a78}.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin:20px 0}input,select,button{font:inherit;border:1px solid #bac6d8;border-radius:8px;padding:10px;max-width:100%;box-sizing:border-box}button{cursor:pointer;background:#123a78;color:white;border:0}button.secondary{background:#e7edf7;color:#123a78}table{border-collapse:collapse;width:100%;background:white}th,td{text-align:left;padding:11px;border-bottom:1px solid #e6eaf0}th{background:#e9eef6;color:#243e61}.scroll{overflow:auto;border-radius:10px;border:1px solid #dde4ef}a{color:#1555a4}dialog{border:0;border-radius:12px;max-width:460px;width:calc(100% - 35px);box-shadow:0 12px 55px #0004}dialog label{display:block;margin:10px 0 4px}dialog input,dialog select{width:100%}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}.note{font-size:13px;color:#53657b}nav a{color:white;margin-right:18px}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}th,td{padding:8px;font-size:13px}header{padding:20px 16px}}</style></head><body><header><h1>🍪 MIKETOWN Instant Rating</h1><p>Oreo reviews, rankings & what's next.</p><nav><a href="https://www.youtube.com/playlist?list=PL7Fnb8XgidP3IO4kWO6XBmzaFAp0888ll" target="_blank" rel="noopener">YouTube</a><a href="https://www.tiktok.com/@themiketown" target="_blank" rel="noopener">TikTok</a><a href="https://www.instagram.com/miketown/" target="_blank" rel="noopener">Instagram</a></nav></header><main><div class="stats" id="stats"></div><div class="toolbar"><input id="search" placeholder="Search flavors" aria-label="Search flavors"><select id="filter"><option value="">All statuses</option><option>Reviewed</option><option>On Hand</option><option>Incoming</option><option>Wish List</option><option>Old Post</option></select><select id="sort"><option value="number">Review order</option><option value="name">Flavor A–Z</option><option value="rating">Highest rated</option><option value="date">Newest reviewed</option></select><button id="export" class="secondary">Export CSV</button></div><p class="note">Connecting to Google Sheets…</p><div class="scroll"><table><thead><tr><th>Review #</th><th>Flavor</th><th>Status</th><th>Rating / 5</th><th>Date Reviewed</th><th>Videos</th></tr></thead><tbody id="body"></tbody></table></div></main><script>let data=[];const $=id=>document.getElementById(id);const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){let rated=data.filter(x=>x.status==='Reviewed'&&x.rating!==''&&Number.isFinite(+x.rating));let avg=rated.length?(rated.reduce((s,x)=>s+ +x.rating,0)/rated.length).toFixed(2):'—';$('stats').innerHTML=[['Reviewed',data.filter(x=>x.status==='Reviewed').length],['Average rating',avg],['On hand',data.filter(x=>x.status==='On Hand').length],['In queue',data.filter(x=>['Wish List','Incoming','On Hand'].includes(x.status)).length]].map(([k,v])=>'<div class="stat">'+escape(k)+'<strong>'+v+'</strong></div>').join('');let a=data.filter(x=>(!$('filter').value||x.status===$('filter').value)&&x.flavor.toLowerCase().includes($('search').value.toLowerCase()));let sort=$('sort').value;a.sort((x,y)=>sort==='name'?x.flavor.localeCompare(y.flavor):sort==='rating'?(Number(y.rating)||0)-(Number(x.rating)||0):sort==='date'?(y.date||'').localeCompare(x.date||''):((parseInt(y.number.split('.')[1])||0)-(parseInt(x.number.split('.')[1])||0)));$('body').innerHTML=a.map(x=>'<tr><td>'+escape(x.number||'—')+'</td><td><strong>'+escape(x.flavor)+'</strong></td><td>'+escape(x.status)+'</td><td>'+escape(x.rating||'—')+'</td><td>'+escape(x.date||'—')+'</td><td>'+['youtube','tiktok','instagram'].filter(k=>x[k]).map(k=>'<a target="_blank" rel="noopener noreferrer" href="'+escape(x[k])+'">'+k[0].toUpperCase()+'</a>').join(' · ')+'</td></tr>').join('')||'<tr><td colspan="6">No matching Oreos</td></tr>'}for(let k of ['search','filter','sort'])$(k).addEventListener(k==='search'?'input':'change',render);$('export').onclick=()=>{let keys=['number','flavor','status','rating','date','youtube','tiktok','instagram','notes'];let csv=[keys.join(','),...data.map(r=>keys.map(k=>'"'+String(r[k]??'').replace(/"/g,'""')+'"').join(','))].join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='miketown-oreo-ratings.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};render();
const endpoint='https://script.google.com/macros/s/AKfycbzlCOTLlvWDzmKU0TN9g0PtPFjt9Z3qeuDVYmPCpyUuN_w3K9nYqzZQicgzeImekbDe7Q/exec';
const note=document.querySelector('.note');
function importRows(rows){
 if(!Array.isArray(rows)||rows.length<2||!Array.isArray(rows[0]))throw Error('Unexpected sheet format');
 const headers=rows[0].map(v=>String(v||'').trim().toLowerCase());
 const fi=headers.indexOf('flavor'),si=headers.indexOf('status');
 if(fi<0||si<0)throw Error('Missing Flavor or Status columns');
 const ix=(...names)=>names.map(n=>headers.indexOf(n)).find(i=>i>=0)??-1;
 const ri=ix('rating','score'),di=ix('date reviewed','date'),yi=ix('youtube','youtube url'),ti=ix('tiktok','tiktok url'),ii=ix('instagram','instagram url'),ni=ix('notes');
 const get=(row,i)=>i<0?'':String(row[i]??'').trim();
 return rows.slice(1).filter(r=>Array.isArray(r)&&get(r,fi)&&get(r,fi).toUpperCase()!=='NONE').map((r,i)=>{
 const raw=get(r,si),m=raw.match(/^(4\.\d+)\s*Reviewed/i);
 const status=m?'Reviewed':raw.replace(/^\d+\.\s*/,'').trim();
 return {id:i+1,flavor:get(r,fi),status,number:m?m[1]:get(r,ix('review number','review #')),rating:get(r,ri),date:get(r,di),youtube:get(r,yi),tiktok:get(r,ti),instagram:get(r,ii),notes:get(r,ni)};
 });
}
async function loadSheet(){
 try{
  const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),12000);
  let response;try{response=await fetch(endpoint,{redirect:'follow',signal:controller.signal,cache:'no-store'})}finally{clearTimeout(timer)}
  if(!response.ok)throw Error('HTTP '+response.status);
  const payload=await response.json();
  if(!payload.ok)throw Error('API returned an error');
  data=importRows(payload.data);
  note.textContent='Live Google Sheets · Last refreshed '+new Intl.DateTimeFormat(undefined,{dateStyle:'medium',timeStyle:'short'}).format(new Date())+' · Edit data in Sheet1; refresh this page to see changes.';
  render();
 }catch(e){
  note.textContent='Could not load Google Sheets. Please refresh to try again. No sample data is displayed.';
  render();
 }
}
loadSheet();</script></body></html>
